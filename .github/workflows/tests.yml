name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradejournal
          POSTGRES_PASSWORD: tradejournal
          POSTGRES_DB: tradejournal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradejournal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tradejournal:tradejournal@localhost:5432/tradejournal_test
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://tradejournal:tradejournal@localhost:5432/tradejournal_migration_test
        run: uv run pytest app/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check i18n catalogs and hardcoded strings
        working-directory: frontend
        run: npm run i18n:check

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
